name: C1 hourly gauge collector

on:
  schedule:
    - cron: '7 * * * *'      #every hour at minute 7 
  workflow_dispatch:          #adds a "Run workflow" button

permissions:
  contents: write             #allows the job to push to the data branch

concurrency:
  group: gauge-collector      #never run two collectors at once
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4
        with:
          path: code

      - name: Get the data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install packages
        run: pip install requests==2.32.4 pandas==2.2.2

      - name: Collect readings
        run: python code/c1_ingestion/collectors/gauges.py --out data/Station_Rainfall_CSVs --log data/run_log.csv

      - name: Save to the data branch
        if: always()
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Station_Rainfall_CSVs run_log.csv
          git diff --cached --quiet || git commit -m "data: hourly update $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push